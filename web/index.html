<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>growth-lab</title>
<link rel="stylesheet" href="/styles.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<header class="topbar">
  <span class="brand">growth-lab</span>
  <nav class="tabs" role="tablist" aria-label="화면">
    <button role="tab" id="tab-work" aria-selected="true">새 패널</button>
    <button role="tab" id="tab-dash" aria-selected="false">대시보드 <span class="num" id="dash-count"></span></button>
    <button role="tab" id="tab-quality" aria-selected="false">데이터 품질</button>
  </nav>
  <div class="snapinfo" id="snapinfo"><span class="muted">불러오는 중…</span></div>
  <div class="userbar" id="userbar" hidden><span id="user-name"></span><button type="button" class="btn sm" id="b-logout">로그아웃</button></div>
</header>

<section class="view" id="view-login" hidden>
  <form class="login" id="login-form">
    <h2>로그인</h2>
    <label for="login-user">아이디</label>
    <input id="login-user" autocomplete="username" maxlength="32" required>
    <label for="login-pass">비밀번호</label>
    <input id="login-pass" type="password" autocomplete="current-password" maxlength="256" required>
    <p class="login-err" id="login-err" role="alert"></p>
    <button class="btn primary" type="submit" id="login-go">로그인</button>
  </form>
</section>

<section class="view" id="view-work" hidden>
  <div class="work">
    <div class="chat">
      <div class="chat-actions">
        <span class="muted note-sm" id="conv-label"></span>
        <button type="button" class="btn sm" id="b-new">새로 시작</button>
      </div>
      <div class="chat-log" id="log" aria-live="polite">
        <div class="msg agent">어떤 패널이 필요하세요? 질문으로 써 주시면 정의가 애매한 부분은 먼저 여쭤볼게요.</div>
      </div>
      <div class="suggest" id="suggest"></div>
      <form class="composer" id="composer">
        <label for="prompt" class="sr-only">요청</label>
        <textarea id="prompt" rows="1" maxlength="2000" placeholder="예: 최근 8주 가입자 중 다른 회원과 연결된 비율을 주별로 보여줘"></textarea>
        <button class="btn" type="button" id="b-stop" hidden>중지</button>
        <button class="btn primary" type="submit" id="send">보내기</button>
      </form>
    </div>
    <div class="preview" id="preview">
      <div class="empty">
        <h2>요청하면 여기에 패널이 그려집니다</h2>
        <p>에이전트가 만든 SQL은 엔진이 검사하고 원본·가명 사본에서 모두 실행한 뒤에만 이 자리에 나타납니다. 검사에 실패하면 이전 미리보기를 그대로 둡니다.</p>
      </div>
    </div>
  </div>
</section>

<section class="view" id="view-dash" hidden>
  <div class="page">
    <div class="placeholder"><p>불러오는 중…</p></div>
  </div>
</section>

<section class="view" id="view-quality" hidden>
  <div class="page">
    <div class="placeholder"><p>불러오는 중…</p></div>
  </div>
</section>
</body>
</html>
