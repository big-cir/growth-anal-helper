<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>growth-lab</title>
<link rel="stylesheet" href="/styles.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<header class="topbar">
  <span class="brand">growth-lab</span>
  <nav class="tabs" role="tablist" aria-label="Views">
    <button role="tab" id="tab-work" aria-selected="true">New panel</button>
    <button role="tab" id="tab-dash" aria-selected="false"><span id="tab-dash-label">Dashboard</span> <span class="num" id="dash-count"></span></button>
    <button role="tab" id="tab-quality" aria-selected="false">Data quality</button>
  </nav>
  <div class="snapinfo" id="snapinfo"><span class="muted">Loading…</span></div>
  <div class="userbar" id="userbar" hidden><span id="user-name"></span><button type="button" class="btn sm" id="b-logout">Sign out</button></div>
</header>

<section class="view" id="view-login" hidden>
  <form class="login" id="login-form">
    <h2 id="login-title">Sign in</h2>
    <label for="login-user">Username</label>
    <input id="login-user" autocomplete="username" maxlength="32" required>
    <label for="login-pass">Password</label>
    <input id="login-pass" type="password" autocomplete="current-password" maxlength="256" required>
    <p class="login-err" id="login-err" role="alert"></p>
    <button class="btn primary" type="submit" id="login-go">Sign in</button>
  </form>
</section>

<section class="view" id="view-work" hidden>
  <div class="work">
    <div class="chat">
      <div class="chat-actions">
        <span class="muted note-sm" id="conv-label"></span>
        <button type="button" class="btn sm" id="b-new">Start over</button>
      </div>
      <div class="chat-log" id="log" aria-live="polite">
        <div class="msg agent"></div>
      </div>
      <div class="suggest" id="suggest"></div>
      <form class="composer" id="composer">
        <label for="prompt" class="sr-only">Request</label>
        <textarea id="prompt" rows="1" maxlength="2000"></textarea>
        <button class="btn" type="button" id="b-stop" hidden>Stop</button>
        <button class="btn primary" type="submit" id="send">Send</button>
      </form>
    </div>
    <div class="preview" id="preview"></div>
  </div>
</section>

<section class="view" id="view-dash" hidden>
  <div class="page">
    <div class="placeholder"><p>Loading…</p></div>
  </div>
</section>

<section class="view" id="view-quality" hidden>
  <div class="page">
    <div class="placeholder"><p>Loading…</p></div>
  </div>
</section>
</body>
</html>
